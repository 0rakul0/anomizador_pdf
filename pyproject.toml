[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomizador-pdf"
version = "0.1.0"
description = "Redação local de dados pessoais em PDFs em português"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.26,<2", "spacy>=3.8,<3.9"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
anonimizar-pdf = "anonymizer.cli:main"

[tool.setuptools.packages.find]
include = ["anonymizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
